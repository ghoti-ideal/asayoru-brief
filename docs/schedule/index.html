<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>きざみ</title>
<meta name="description" content="5分単位で一日を組み立てるマイクロスケジュール帳。">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="きざみ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout
   スマホ: 上に日付の移動、下に「日・週・やること・設定」の切り替え。日ビュー = いまの予定 → すばやく追加 → タイムライン
   PC(960px以上): 左に月のカレンダー・いまの予定・やること、右にタイムライン（日／週） */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --fg:#1d1b19; --muted:#6b655f; --line:#e4dfd9; --line2:#efebe6;
  --accent:#c4532f; --accent-fg:#ffffff; --accent-soft:#f7e3da; --now:#d13b2a; --danger:#b3261e;
  --b-blue:#3d6fb6; --s-blue:#e3ecf8; --b-green:#2f8a5b; --s-green:#dff1e6; --b-amber:#b7791f; --s-amber:#f8ecd6;
  --b-rose:#c2416b; --s-rose:#f8e1e9; --b-violet:#7357b8; --s-violet:#ece6f7; --b-gray:#6b6f76; --s-gray:#eceef0;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --nav-h:60px; --gutter:50px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1d1b1a; --fg:#ece8e3; --muted:#a39d96; --line:#33302c; --line2:#262321;
    --accent:#ef8a68; --accent-fg:#1d1b1a; --accent-soft:#3a2219; --now:#ff6b57; --danger:#ff8a80;
    --b-blue:#7fa8e6; --s-blue:#1c2a3d; --b-green:#6cc495; --s-green:#183024; --b-amber:#e0b25e; --s-amber:#382d17;
    --b-rose:#ec8aa8; --s-rose:#3a1d27; --b-violet:#ad98ec; --s-violet:#29213f; --b-gray:#a7abb2; --s-gray:#2a2c30;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1d1b1a; --fg:#ece8e3; --muted:#a39d96; --line:#33302c; --line2:#262321;
  --accent:#ef8a68; --accent-fg:#1d1b1a; --accent-soft:#3a2219; --now:#ff6b57; --danger:#ff8a80;
  --b-blue:#7fa8e6; --s-blue:#1c2a3d; --b-green:#6cc495; --s-green:#183024; --b-amber:#e0b25e; --s-amber:#382d17;
  --b-rose:#ec8aa8; --s-rose:#3a1d27; --b-violet:#ad98ec; --s-violet:#29213f; --b-gray:#a7abb2; --s-gray:#2a2c30;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;left:50%;top:40px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ヘッダー */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:8px;height:52px;max-width:1280px;margin:0 auto;
  padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));position:relative}
.brand{font-weight:900;letter-spacing:.14em;font-size:15px;display:none;margin-right:8px}
.dnav{display:flex;align-items:center;gap:2px;min-width:0;flex:1}
.ib{width:36px;height:36px;border:0;background:transparent;border-radius:10px;font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--line2)}
.dlabel{border:0;background:transparent;font-weight:700;font-size:16px;padding:4px 6px;border-radius:8px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dlabel:hover{background:var(--line2)}
.pill{border:1px solid var(--line);background:var(--surface);font-size:13px;padding:4px 12px;border-radius:999px;white-space:nowrap;flex:none}
.pill:hover{border-color:var(--muted)}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hright{display:flex;align-items:center;gap:8px;flex:none}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--b-green)}
.sync[data-s="busy"]::before{background:var(--b-amber)}
.sync[data-s="err"]{color:var(--danger)}
.sync[data-s="err"]::before{background:var(--danger)}
.sync .t{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 14px;font-size:13px}
.seg button.on{background:var(--fg);color:var(--bg)}
.desk{display:none!important}

/* 下のナビ（スマホ） */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--muted)}
.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{color:var(--accent);font-weight:700}

/* レイアウト */
.layout{max-width:1280px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 32px max(12px,env(safe-area-inset-left,0px))}
aside{display:none}
body[data-view="tasks"] aside{display:block}
body[data-view="tasks"] main{display:none}
aside .minical, aside .now-slot{display:none}
main section{display:none}
body[data-view="day"] #dayView, body[data-view="week"] #weekView, body[data-view="settings"] #settingsView{display:block}

@media (min-width:960px){
  body{padding-bottom:0}
  .bnav{display:none}
  .desk{display:flex!important}
  .brand{display:block}
  .sync .t{display:inline}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
  aside, body[data-view="tasks"] aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:68px;max-height:calc(100vh - 80px);overflow:auto;padding-bottom:8px}
  aside .minical, aside .now-slot{display:block}
  body[data-view="tasks"] main{display:block}
  body[data-view="tasks"] #dayView{display:block}
  main .now-slot{display:none}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
h2.h{font-size:14px;margin:0 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.h .n{font-size:12px;color:var(--muted);font-weight:400}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}

/* いまの予定 */
.now-slot{margin-bottom:12px}
.now{border-left:4px solid var(--accent)}
.now-k{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.now-t{font-size:18px;font-weight:700;margin:2px 0 4px;overflow-wrap:anywhere}
.now-t.idle{color:var(--muted);font-weight:500}
.now-r{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.now-r .big{font-family:var(--f-mono);font-size:30px;font-weight:500;color:var(--fg);line-height:1.1;font-variant-numeric:tabular-nums}
.pbar{height:6px;background:var(--line2);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.now-next{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:8px}
.lbl{font-size:12px;color:var(--muted)}

/* すばやく追加 */
.qa{display:flex;gap:6px}
.qa input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:16px}
.qa input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* 日の道具 */
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px;flex-wrap:wrap}
.sum{font-size:13px;color:var(--muted)}
.sum b{color:var(--fg);font-weight:700}
.zoom{display:flex;align-items:center;gap:4px}
.zoom .btn{min-width:34px;padding:3px 8px}

/* タイムライン */
.tl{-webkit-touch-callout:none;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none}
.tl-grid{position:absolute;inset:0 0 0 var(--gutter);
  background-image:linear-gradient(to bottom,var(--line) 0 1px,transparent 1px),linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px);
  background-size:100% var(--ph),100% var(--pq)}
.tl-lab{position:absolute;left:0;width:calc(var(--gutter) - 6px);text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateY(-50%);line-height:1}
.tl-lab.half{opacity:.55;font-size:10px}
.tl-lab:first-child{transform:none;top:3px!important}
.tl-cols{position:absolute;top:0;bottom:0;left:calc(var(--gutter) + 2px);right:6px;cursor:crosshair}
.blk{position:absolute;border-radius:7px;background:var(--s-blue);border-left:4px solid var(--b-blue);padding:3px 6px 3px 28px;overflow:hidden;cursor:grab;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--surface) 70%,transparent);touch-action:auto}
.blk .bt{display:flex;flex-wrap:wrap;column-gap:8px;align-items:baseline;line-height:1.35;min-width:0}
.blk .tt{font-size:14px;font-weight:700;overflow-wrap:anywhere;min-width:0}
.blk .tm{font-size:11px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.blk .chk{position:absolute;left:5px;top:4px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--b-blue);background:var(--surface);padding:0;display:grid;place-items:center}
.blk .chk::after{content:"";width:8px;height:4px;border:solid var(--surface);border-width:0 0 2px 2px;transform:translate(0,-1px) rotate(-45deg);opacity:0}
.blk.done .chk{background:var(--b-blue)}
.blk.done .chk::after{opacity:1}
.blk.done{opacity:.55}
.blk.done .tt{text-decoration:line-through}
.blk.cur{box-shadow:0 0 0 2px var(--accent)}
.blk .grip{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;touch-action:none}
.blk .grip::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:0;color:var(--b-blue)}
.blk:hover .grip::after,.blk.dragging .grip::after{opacity:.5}
.blk.tiny{padding-top:0;padding-bottom:0;padding-left:24px}
.blk.tiny .bt{flex-wrap:nowrap;white-space:nowrap}
.blk.tiny .tt{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.blk.tiny .chk{width:14px;height:14px;top:50%;margin-top:-7px;left:5px}
.blk.tiny .chk::after{width:6px;height:3px}
.blk.dragging{z-index:5;cursor:grabbing;box-shadow:0 6px 18px rgba(0,0,0,.18),0 0 0 2px var(--accent);opacity:.95}
.blk.fixed{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--fg) 5%,transparent) 6px 8px)}
.ghost{position:absolute;left:0;right:0;background:var(--accent-soft);border:2px dashed var(--accent);border-radius:7px;font-size:12px;padding:2px 8px;font-family:var(--f-mono);pointer-events:none;z-index:4}
.drop .ghost{display:block}
.nowline{position:absolute;left:calc(var(--gutter) - 4px);right:0;height:2px;background:var(--now);z-index:6;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}

.c-blue{--b:var(--b-blue);--s:var(--s-blue)} .c-green{--b:var(--b-green);--s:var(--s-green)} .c-amber{--b:var(--b-amber);--s:var(--s-amber)}
.c-rose{--b:var(--b-rose);--s:var(--s-rose)} .c-violet{--b:var(--b-violet);--s:var(--s-violet)} .c-gray{--b:var(--b-gray);--s:var(--s-gray)}
.blk[class*="c-"]{background-color:var(--s);border-left-color:var(--b)}
.blk[class*="c-"] .chk{border-color:var(--b)}
.blk[class*="c-"].done .chk{background:var(--b)}
.blk[class*="c-"] .grip::after{color:var(--b)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--b);flex:none;display:inline-block}

/* 週 */
.wk-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.wk{min-width:calc(var(--gutter) + 7 * 92px);position:relative}
.wk-head{display:grid;grid-template-columns:var(--gutter) repeat(7,1fr);position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:3}
.wk-head button{border:0;background:transparent;padding:8px 2px;text-align:center;line-height:1.3;border-left:1px solid var(--line2)}
.wk-head button:hover{background:var(--line2)}
.wk-head .d{font-size:16px;font-weight:700;display:block}
.wk-head .w{font-size:11px;color:var(--muted)}
.wk-head .m{font-size:10px;color:var(--muted);font-family:var(--f-mono);display:block}
.wk-head .today .d{color:var(--accent)}
.wk-head .sel{background:var(--accent-soft)}
.wk-body{position:relative}
.wk-col{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.wk-col .blk{padding:1px 4px 1px 6px;border-left-width:3px;cursor:pointer;border-radius:5px}
.wk-col .blk .tt{font-size:11px;font-weight:500}
.wk-col .blk .tm,.wk-col .blk .chk,.wk-col .blk .grip{display:none}

/* 月のカレンダー */
.mc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mc-h b{font-size:14px}
.mc-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mc-g .w{font-size:11px;color:var(--muted);padding:2px 0}
.mc-g button{border:0;background:transparent;border-radius:8px;padding:4px 0 6px;font-size:13px;position:relative;font-family:var(--f-mono)}
.mc-g button:hover{background:var(--line2)}
.mc-g button.out{color:var(--muted);opacity:.5}
.mc-g button.today{color:var(--accent);font-weight:700}
.mc-g button.sel{background:var(--accent);color:var(--accent-fg)}
.mc-g button.has::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.6}

/* やること */
.tasks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px;background:var(--surface)}
.tasks li[draggable="true"]{cursor:grab}
.tasks .tt{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:2px 0;overflow-wrap:anywhere;font-size:14px}
.tasks .du{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.empty{font-size:13px;color:var(--muted);padding:8px 2px}

/* 設定 */
.set{display:flex;flex-direction:column;gap:14px;max-width:720px}
.set h2{font-size:15px;margin:0 0 10px}
.set .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;border-top:1px solid var(--line2)}
.set .row:first-of-type{border-top:0}
.set .row > span{flex:1 1 160px;font-size:14px}
.set select,.set input[type="text"],.set input[type="password"],.set input[type="time"]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:15px;max-width:100%}
.set p{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.7}
.set ol{font-size:13px;color:var(--muted);margin:6px 0;padding-left:1.4em;line-height:1.8}
.set code{font-family:var(--f-mono);font-size:12px;background:var(--line2);padding:1px 4px;border-radius:4px}
.tokrow{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.tokrow input{flex:1 1 200px;min-width:0}

/* ダイアログ */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--fg);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);
  box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:16px;overflow:auto;max-height:calc(100dvh - 24px)}
dialog header{display:flex;align-items:center;justify-content:space-between}
dialog h3{margin:0;font-size:16px;outline:none}
.x{border:0;background:transparent;font-size:22px;width:36px;height:36px;border-radius:10px;line-height:1}
.x:hover{background:var(--line2)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12px;color:var(--muted)}
.f input,.f textarea,.f select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px;width:100%;min-width:0}
.f textarea{resize:vertical}
.r3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-family:var(--f-mono)}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.durin{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:6px}
.durin input{width:90px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:16px}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--b);padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--b)}
.ck{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.ck input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.extra{display:flex;flex-wrap:wrap;gap:6px}
dialog footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
dialog footer .r{display:flex;gap:8px;margin-left:auto}
.tpl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tpl li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.tpl li .nm{flex:1 1 140px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.tpl li .lbl{width:100%}
@media (max-width:600px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92dvh}
  dialog form{max-height:92dvh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .r3{grid-template-columns:1fr 1fr}

<script>
"use strict";
/* ========== 基本 ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PFX = "kizami:";
const load = (k, d) => { try { const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(PFX + k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const COLS = ["blocks", "tasks", "templates"];
const COLORS = [["blue", "青"], ["green", "緑"], ["amber", "黄"], ["rose", "赤"], ["violet", "紫"], ["gray", "灰"]];
const colOf = (c) => (COLORS.some((x) => x[0] === c) ? c : "blue");
const DURS = [5, 10, 15, 20, 25, 30, 45, 60, 90, 120];
const ZOOMS = [1, 1.5, 2, 3, 4, 6];
const DEF = { zoom: 3, snap: 5, rangeStart: 6, rangeEnd: 24, weekStart: 1, theme: "auto", workStart: 540, defaultDur: 15,
  notify: false, notifyBefore: 0, gistToken: "", gistId: "", lastSync: 0 };

let db = load("db", null);
if (!db || typeof db !== "object") db = {};
COLS.forEach((c) => { if (!db[c] || typeof db[c] !== "object") db[c] = {}; });
let S = Object.assign({}, DEF, load("settings", {}));
const ui = Object.assign({ view: "day" }, load("ui", {}));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, "0");
const dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const kdate = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addD = (k, n) => { const d = kdate(k); d.setDate(d.getDate() + n); return dkey(d); };
const WD = "日月火水木金土";
const today = () => dkey(new Date());
const nowM = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const hm = (m) => { m = Math.round(m); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
const hm2 = (m) => { m = Math.round(m) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const durTxt = (m) => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}時間${r}分` : `${h}時間`) : `${r}分`; };
const dateLabel = (k) => { const d = kdate(k); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const snapM = (m, s = S.snap) => Math.round(m / s) * s;
const ceilSnap = (m, s = S.snap) => Math.ceil(m / s) * s;
const parseHM = (v) => { const m = /^(\d{1,2}):(\d{2})/.exec(v || ""); return m ? +m[1] * 60 + +m[2] : null; };

function saveDb() { if (!save("db", db)) toast("保存できませんでした。端末の空き容量を確認してください"); }
function saveS() { save("settings", S); }
function saveUi() { save("ui", ui); }

// 削除の記録は同期のために90日残し、それより古いものは消す
(function purge() {
  const lim = Date.now() - 90 * 864e5; let n = 0;
  COLS.forEach((c) => Object.values(db[c]).forEach((r) => { if (r.deleted && (r.updatedAt || 0) < lim) { delete db[c][r.id]; n++; } }));
  if (n) saveDb();
})();

const live = (c) => Object.values(db[c]).filter((r) => !r.deleted);
const dayBlocks = (k) => live("blocks").filter((b) => b.date === k).sort((a, b) => a.start - b.start || b.dur - a.dur);

let sel = today();
let followToday = true;
let calMonth = sel.slice(0, 7);

/* ========== 変更（元に戻す） ========== */
function commit(changes, label, action) {
  if (!changes.length) return;
  const t = Date.now();
  const prev = changes.map(([c, r]) => [c, r.id, db[c][r.id] ? { ...db[c][r.id] } : null]);
  changes.forEach(([c, r]) => { db[c][r.id] = { ...r, updatedAt: t }; });
  saveDb(); render(); sync.soon();
  const undo = () => {
    const t2 = Date.now();
    prev.forEach(([c, id, p]) => { db[c][id] = p ? { ...p, updatedAt: t2 } : { id, deleted: true, updatedAt: t2 }; });
    saveDb(); render(); sync.soon(); toast("元に戻しました");
  };
  if (label) toast(label, action || { text: "元に戻す", fn: undo });
  return undo;
}
const B = (r) => ["blocks", r], T = (r) => ["tasks", r], TP = (r) => ["templates", r];

/* ========== 空き時間・遅れの反映 ========== */
// from 以降で dur 分入る最初の空き（なければ null）
function firstFree(k, from, dur, exceptId) {
  let t = from;
  for (const b of dayBlocks(k)) {
    if (b.id === exceptId) continue;
    const e = b.start + b.dur;
    if (e <= t) continue;
    if (b.start >= t + dur) break;
    t = Math.max(t, e);
  }
  return t + dur <= 1440 ? t : null;
}
function baseStart(k) {
  if (k === today()) return clamp(ceilSnap(nowM()), 0, 1440);
  return S.workStart;
}
// edge より前に重なる予定を後ろへ押し出す。空き時間があればそこで吸収し、固定の予定は動かさず飛び越す
function ripple(k, fromStart, edge, exceptId) {
  const list = dayBlocks(k).filter((b) => b.id !== exceptId && !b.done && b.start >= fromStart);
  const fixed = list.filter((b) => b.fixed);
  const out = []; let over = false;
  for (const b of list) {
    if (b.fixed) continue;
    let s = Math.max(b.start, edge);
    if (s !== b.start) {
      for (let guard = 0, hit = true; hit && guard < 50; guard++) {
        hit = false;
        for (const f of fixed) if (f.start < s + b.dur && f.start + f.dur > s) { s = f.start + f.dur; hit = true; }
      }
    }
    if (s + b.dur > 1440) { s = 1440 - b.dur; over = true; }
    if (s !== b.start) out.push({ ...b, start: s });
    edge = s + b.dur;
  }
  return { out, over };
}
function currentBlock() {
  const k = today(), n = nowM();
  const list = dayBlocks(k).filter((b) => !b.done && b.start <= n && n < b.start + b.dur);
  return list.length ? list[list.length - 1] : null;
}
function nextBlock() {
  const k = today(), n = nowM();
  return dayBlocks(k).find((b) => !b.done && b.start > n) || null;
}
function extendCur(id, N) {
  const b = db.blocks[id]; if (!b) return;
  const dur = clamp(b.dur + N, 1, 1440 - b.start);
  const r = ripple(b.date, b.start, b.start + dur, b.id);
  commit([B({ ...b, dur }), ...r.out.map(B)], `${N}分延長しました${r.out.length ? `（後ろの${r.out.length}件をずらしました）` : ""}`);
  if (r.over) setTimeout(() => toast("24時を超えるため、一部の予定が重なっています"), 2600);
}
function delayCur(id, N) {
  const b = db.blocks[id]; if (!b) return;
  const start = clamp(b.start + N, 0, 1440 - b.dur);
  const r = ripple(b.date, b.start, start + b.dur, b.id);
  commit([B({ ...b, start }), ...r.out.map(B)], `${N}分遅らせました${r.out.length ? `（後ろの${r.out.length}件も）` : ""}`);
}
function completeCur(id) {
  const b = db.blocks[id]; if (!b) return;
  const k = b.date, end = b.start + b.dur;
  const n = k === today() ? Math.ceil(nowM()) : end;
  const gap = end - n;
  const undo = commit([B({ ...b, done: true })], null);
  // 早く終わったら、すぐ後ろに続いている予定を前に詰められるようにする
  const chain = []; let edge = end;
  if (gap >= 1) for (const x of dayBlocks(k)) {
    if (x.id === b.id || x.done || x.start < end) continue;
    if (x.start !== edge || x.fixed) break;
    chain.push(x); edge = x.start + x.dur;
  }
  if (chain.length) {
    toast(`完了。${gap}分早く終わりました`, { text: `後ろを${gap}分詰める`, fn: () => {
      const cur = db.blocks[b.id];
      commit([B({ ...cur, dur: Math.max(1, n - cur.start) }), ...chain.map((x) => B({ ...db.blocks[x.id], start: db.blocks[x.id].start - gap }))], `後ろの${chain.length}件を詰めました`);
    } });
  } else toast("完了にしました", { text: "元に戻す", fn: undo });
}

/* ========== すばやく追加 ========== */
function parseQuick(s) {
  s = s.normalize("NFKC").replace(/\s+/g, " ").trim();
  let start = null, dur = null, m;
  const cut = (mm) => (s.slice(0, mm.index) + " " + s.slice(mm.index + mm[0].length)).replace(/\s+/g, " ").trim();
  const okT = (h, mi) => h <= 24 && mi < 60 && h * 60 + mi <= 1440;
  if ((m = /(?:^|\s)(\d{1,2}):(\d{2})\s*[-~〜ー−–]\s*(\d{1,2}):(\d{2})(?=\s|$)/.exec(s)) && okT(+m[1], +m[2]) && okT(+m[3], +m[4])) {
    start = +m[1] * 60 + +m[2]; const end = +m[3] * 60 + +m[4];
    if (end > start) dur = end - start;
    s = cut(m);
  } else if ((m = /(?:^|\s)(\d{1,2}):(\d{2})(?=\s|$)/.exec(s)) && okT(+m[1], +m[2])) {
    start = +m[1] * 60 + +m[2]; s = cut(m);
  }
  if (dur == null && (m = /(?:^|\s)(\d+(?:\.\d+)?)\s*(分|m|min|h|時間)?$/i.exec(s))) {
    const v = parseFloat(m[1]);
    const d = /^(h|時間)$/i.test(m[2] || "") ? Math.round(v * 60) : Math.round(v);
    if (d >= 1 && d <= 1440) { dur = d; s = s.slice(0, m.index).trim(); }
  }
  return { title: s || "（無題）", start, dur };
}
function placeNew(k, base) {
  // base: {title, dur, start?, color, memo}
  const dur = clamp(base.dur || S.defaultDur, 1, 1440);
  let start = base.start, warn = "";
  if (start == null) {
    start = firstFree(k, baseStart(k), dur);
    if (start == null) { start = clamp(baseStart(k), 0, 1440 - dur); warn = "（空き時間がないため重ねて入れました）"; }
  }
  start = clamp(start, 0, 1440 - dur);
  return { rec: { id: uid(), date: k, start, dur: Math.min(dur, 1440 - start), title: base.title, color: base.color || "blue", memo: base.memo || "", done: false, fixed: false }, warn };
}

/* ========== 描画 ========== */
const rangeOf = (blocks) => {
  let a = S.rangeStart * 60, z = S.rangeEnd * 60;
  blocks.forEach((b) => { a = Math.min(a, Math.floor(b.start / 60) * 60); z = Math.max(z, Math.ceil((b.start + b.dur) / 60) * 60); });
  if (a >= z) { a = 0; z = 1440; }
  return [a, Math.min(z, 1440)];
};
function layoutLanes(list, minMin) {
  const res = new Map(); let cluster = [], cEnd = -1, laneEnds = [];
  const flush = () => { const n = Math.max(...cluster.map((x) => res.get(x.id).lane + 1)); cluster.forEach((x) => (res.get(x.id).n = n)); cluster = []; laneEnds = []; };
  for (const b of list) {
    const e = b.start + Math.max(b.dur, minMin);
    if (cluster.length && b.start >= cEnd) flush();
    let l = laneEnds.findIndex((x) => x <= b.start);
    if (l < 0) { l = laneEnds.length; laneEnds.push(e); } else laneEnds[l] = e;
    res.set(b.id, { lane: l, n: 1 }); cluster.push(b); cEnd = Math.max(cEnd, e);
  }
  if (cluster.length) flush();
  return res;
}
function blkHTML(b, ppm, r0, lay, isCur, minPx) {
  const top = (b.start - r0) * ppm, h = Math.max(b.dur * ppm, minPx);
  const cls = ["blk", "c-" + colOf(b.color)];
  if (b.done) cls.push("done"); if (b.fixed) cls.push("fixed"); if (isCur) cls.push("cur"); if (h < 34) cls.push("tiny");
  const w = 100 / lay.n;
  return `<div class="${cls.join(" ")}" data-id="${esc(b.id)}" style="top:${top}px;height:${h - 1}px;left:${lay.lane * w}%;width:calc(${w}% - 2px)" title="${esc(b.title)}">` +
    `<button type="button" class="chk" aria-label="${b.done ? "未完了に戻す" : "完了にする"}"></button>` +
    `<div class="bt"><span class="tt">${esc(b.title)}</span><span class="tm">${hm(b.start)}–${hm(b.start + b.dur)} · ${durTxt(b.dur)}${b.fixed ? " · 固定" : ""}</span></div>` +
    `<div class="grip"></div></div>`;
}
let tlGeo = { r0: 0, r1: 1440, ppm: 2 };
function renderDay() {
  const k = sel, list = dayBlocks(k), isToday = k === today(), n = nowM();
  const ppm = S.zoom; const [r0, r1] = rangeOf(list);
  tlGeo = { r0, r1, ppm };
  const H = (r1 - r0) * ppm;
  const tl = $("#tl");
  tl.style.height = H + "px";
  tl.style.setProperty("--ph", 60 * ppm + "px");
  tl.style.setProperty("--pq", (ppm >= 3 ? 5 : 15) * ppm + "px");
  let labs = "";
  for (let m = r0; m < r1; m += 30) {
    if (m % 60 === 0) labs += `<div class="tl-lab" style="top:${(m - r0) * ppm}px">${hm(m)}</div>`;
    else if (ppm >= 2) labs += `<div class="tl-lab half" style="top:${(m - r0) * ppm}px">${hm(m)}</div>`;
  }
  const minPx = 14;
  const lanes = layoutLanes(list, minPx / ppm);
  const cur = isToday ? currentBlock() : null;
  const blocks = list.map((b) => blkHTML(b, ppm, r0, lanes.get(b.id), cur && cur.id === b.id, minPx)).join("");
  const nowLine = isToday && n >= r0 && n <= r1 ? `<div class="nowline" id="nowline" style="top:${(n - r0) * ppm}px"></div>` : "";
  tl.innerHTML = `${labs}<div class="tl-grid" style="top:0"></div><div class="tl-cols" id="cols">${blocks}</div>${nowLine}`;
  // 合計
  const tot = list.reduce((s, b) => s + b.dur, 0), done = list.filter((b) => b.done).reduce((s, b) => s + b.dur, 0);

  const evs = parseICS(text);
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const winA = t0.getTime() - 30 * 864e5, winZ = t0.getTime() + 183 * 864e5;
  const stat = { added: 0, allDay: 0, ruleFirst: 0, out: 0 };
  const overrides = new Map(); // UID → Set(元の開始時刻)
  evs.forEach((ev) => { if (ev.p["RECURRENCE-ID"] && ev.p.UID) { const t = icsTime(ev.p["RECURRENCE-ID"]); if (t) { const u = ev.p.UID.val; if (!overrides.has(u)) overrides.set(u, new Set()); overrides.get(u).add(t.ms); } } });
  const changes = [];
  for (const ev of evs) {
    const st = icsTime(ev.p.DTSTART); if (!st) continue;
    if ((ev.p.STATUS?.val || "").toUpperCase() === "CANCELLED") continue;
    if (st.allDay) { stat.allDay++; continue; }
    let durMin;
    const en = icsTime(ev.p.DTEND);
    if (en && !en.allDay) durMin = (en.ms - st.ms) / 6e4; else if (ev.p.DURATION) durMin = icsDur(ev.p.DURATION.val); else durMin = 0;
    durMin = Math.max(5, Math.round(durMin || 0));
    const uidv = ev.p.UID?.val || (ev.p.SUMMARY?.val || "") + st.ms;
    let occs = [st.ms];
    if (ev.p.RRULE && !ev.p["RECURRENCE-ID"]) {
      const ex = new Set(); ev.ex.forEach((x) => { const t = icsTime(x); if (t) ex.add(t.allDay ? null : t.ms); });
      (overrides.get(uidv) || new Set()).forEach((x) => ex.add(x));
      const list = expandRule(ev.p.RRULE.val, st.ms, winA, winZ, ex);
      if (list) occs = list; else stat.ruleFirst++;
    }
    for (const ms of occs) {
      if (ms < winA || ms > winZ) { stat.out++; continue; }
      const d = new Date(ms), k = dkey(d), start = d.getHours() * 60 + d.getMinutes();
      const id = hashId(uidv + "|" + ms);
      const prev = db.blocks[id];
      const memo = [ev.p.LOCATION && "場所: " + icsUnescape(ev.p.LOCATION.val), ev.p.DESCRIPTION && icsUnescape(ev.p.DESCRIPTION.val)].filter(Boolean).join("\n").slice(0, 2000);
      changes.push(B({ id, date: k, start, dur: Math.min(durMin, 1440 - start), title: icsUnescape(ev.p.SUMMARY?.val || "（無題）"), color: prev?.color || "gray", memo, done: prev && !prev.deleted ? !!prev.done : false, fixed: true, src: "ics" }));
      stat.added++;
    }
  }
  return { changes, stat };
}
// 書き出し（Googleカレンダーへ取り込める .ics）
function icsFold(line) {
  const out = []; let cur = "", bytes = 0;
  for (const ch of line) { const b = new TextEncoder().encode(ch).length; if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; bytes = 0; } cur += ch; bytes += b; }
  out.push(cur); return out.join("\r\n ");
}
function icsEsc(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;"); }
function icsUTC(ms) { return new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
function exportICS(list) {
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//kizami//schedule//JA", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  const stamp = icsUTC(Date.now());
  list.forEach((b) => {
    const s = kdate(b.date).getTime() + b.start * 6e4, e = s + b.dur * 6e4;
    L.push("BEGIN:VEVENT", `UID:${b.id}@kizami`, `DTSTAMP:${stamp}`, `DTSTART:${icsUTC(s)}`, `DTEND:${icsUTC(e)}`, icsFold("SUMMARY:" + icsEsc(b.title)));
    if (b.memo) L.push(icsFold("DESCRIPTION:" + icsEsc(b.memo)));
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ========== 設定 ========== */
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (ui.view === "settings") renderSettings(); });
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function opt(v, cur, label) { return `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${label}</option>`; }
function renderSettings() {
  const hours = (cur, a, z) => [...Array(z - a + 1)].map((_, i) => opt(a + i, cur, `${a + i}:00`)).join("");
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  $("#settingsView").innerHTML = `<div class="set">
  <div class="card"><h2>表示</h2>
    <div class="row"><span>タイムラインの表示範囲</span><select data-s="rangeStart">${hours(S.rangeStart, 0, 23)}</select>〜<select data-s="rangeEnd">${hours(S.rangeEnd, 1, 24)}</select></div>
    <div class="row"><span>時刻の刻み（ドラッグで合わせる単位）</span><select data-s="snap">${[1, 5, 10, 15].map((v) => opt(v, S.snap, v + "分")).join("")}</select></div>
    <div class="row"><span>新しい予定の長さ</span><select data-s="defaultDur">${[5, 10, 15, 20, 25, 30, 45, 60].map((v) => opt(v, S.defaultDur, v + "分")).join("")}</select></div>
    <div class="row"><span>今日以外の日に入れるときの開始時刻</span><input type="time" data-s="workStart" value="${hm2(S.workStart)}"></div>
    <div class="row"><span>週の始まり</span><select data-s="weekStart">${opt(1, S.weekStart, "月曜日")}${opt(0, S.weekStart, "日曜日")}</select></div>
    <div class="row"><span>画面の色</span><select data-s="theme">${opt("auto", S.theme, "端末に合わせる")}${opt("light", S.theme, "ライト")}${opt("dark", S.theme, "ダーク")}</select></div>
  </div>
  <div class="card"><h2>通知</h2>
    <div class="row"><span>予定の開始を知らせる</span><select data-s="notify">${opt("false", S.notify, "しない")}${opt("true", S.notify, "する")}</select>
      <select data-s="notifyBefore">${[0, 1, 3, 5, 10].map((v) => opt(v, S.notifyBefore, v ? v + "分前" : "開始時刻")).join("")}</select></div>
    <p>このアプリを開いている間だけ通知します。閉じている間や、端末がアプリを止めている間は届きません（サーバーを使わない作りのため）。${perm === "denied" ? "<br>いまはブラウザで通知が拒否されています。端末やブラウザの設定から許可してください。" : perm === "unsupported" ? "<br>このブラウザは通知に対応していません。iPhoneではホーム画面に追加したアプリから使えます。" : ""}</p>
  </div>
  <div class="card"><h2>スマホとPCの同期</h2>
    <p>データはそれぞれの端末の中に保存されます。スマホとPCで同じ予定を見るには、GitHubの非公開のGist（メモ置き場）を同期先にします。両方の端末で同じトークンを入れてください。</p>
    <ol>
      <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=kizami" target="_blank" rel="noopener">GitHubのトークン作成ページ</a>を開く（Tokens (classic)）</li>
      <li>「Select scopes」で <code>gist</code> だけにチェックが入っていることを確認し、「Generate token」を押す</li>
      <li>表示された <code>ghp_</code> で始まる文字列をコピーして、下に貼り付ける</li>
    </ol>
    <div class="row"><div class="tokrow"><input type="password" id="tokIn" placeholder="ghp_…" autocomplete="off" value="${esc(S.gistToken)}" aria-label="GitHubのトークン">
      <button class="btn primary" id="tokSave">${S.gistToken ? "保存し直す" : "同期を始める"}</button>${S.gistToken ? `<button class="btn" id="syncNow">今すぐ同期</button><button class="btn danger" id="tokOff">同期をやめる</button>` : ""}</div></div>
    <p>状態: <span id="syncStatus">${esc(syncText())}</span></p>
    <p>トークンはこの端末の中だけに保存されます。トークンを知っている人はGistを読み書きできるので、他の人に見せないでください。</p>
  </div>
  <div class="card"><h2>Googleカレンダーから移す</h2>
    <ol>
      <li>PCでGoogleカレンダーの「設定」→「インポート / エクスポート」→「エクスポート」を押す</li>
      <li>ダウンロードされたZIPを展開し、中の <code>.ics</code> ファイルを下で選ぶ（複数選べます）</li>
    </ol>
    <div class="row"><input type="file" id="icsIn" accept=".ics,text/calendar" multiple></div>
    <p>30日前から半年先までの、時刻のある予定を「固定」の灰色の予定として取り込みます。終日の予定は取り込みません。繰り返しの予定は、毎日・毎週・毎月・毎年の基本的な形に対応し、それ以外は初回だけ入ります。同じファイルを取り込み直すと、前に取り込んだ分は上書きされます。</p>
    <div class="row"><button class="btn danger" id="icsClear">取り込んだ予定をすべて消す</button></div>
  </div>
  <div class="card"><h2>書き出し・バックアップ</h2>
    <div class="row"><span>Googleカレンダーなどに入れる .ics（今日以降、自分で作った予定）</span><button class="btn" id="icsOut">書き出す</button></div>
    <div class="row"><span>バックアップ（.json）</span><button class="btn" id="jsonOut">書き出す</button><label class="btn">読み込む<input type="file" id="jsonIn" accept=".json,application/json" hidden></label></div>
    <p>バックアップを読み込むと、今のデータと合わせます（同じ予定は新しく変更したほうが残ります）。</p>
    <div class="row"><button class="btn danger" id="wipe">この端末のデータをすべて消す</button></div>
  </div>
  <div class="card"><h2>ホーム画面に追加</h2>
    ${isStandalone() ? `<p>アプリとして開いています。</p>` : installEvt ? `<div class="row"><span>この端末にアプリとして入れる</span><button class="btn primary" id="install">インストール</button></div>` :
    `<p>Android（Chrome）: 右上の「︙」→「アプリをインストール」または「ホーム画面に追加」<br>iPhone（Safari）: 下の共有ボタン →「ホーム画面に追加」<br>PC（Chrome / Edge）: アドレスバー右側のインストールのアイコン</p>`}
  </div>
  </div>`;
}
$("#settingsView").addEventListener("change", async (e) => {
  const k = e.target.dataset.s;
  if (k) {
    let v = e.target.value;
    if (k === "workStart") { v = parseHM(v); if (v == null) return; }
    else if (k === "theme") {} else if (k === "notify") v = v === "true"; else v = +v;
    if (k === "rangeEnd" && v <= S.rangeStart) { toast("終わりは始まりより後にしてください"); renderSettings(); return; }
    if (k === "rangeStart" && v >= S.rangeEnd) { toast("始まりは終わりより前にしてください"); renderSettings(); return; }
    S[k] = v; saveS();
    if (k === "theme") applyTheme();
    if (k === "notify" && v && "Notification" in window && Notification.permission === "default") {
      const p = await Notification.requestPermission();
      if (p !== "granted") toast("通知が許可されなかったため、画面の中だけでお知らせします");
    }
    render(); renderSettings();
    return;
  }
  if (e.target.id === "icsIn") {
    const files = [...e.target.files]; if (!files.length) return;
    let all = [], st = { added: 0, allDay: 0, ruleFirst: 0, out: 0 };
    for (const f of files) {
      try { const r = importICS(await f.text()); all = all.concat(r.changes); Object.keys(st).forEach((x) => (st[x] += r.stat[x])); }
      catch (err) { toast(`「${f.name}」を読み取れませんでした`); }
    }
    e.target.value = "";
    if (!all.length) { toast(`取り込める予定がありませんでした${st.allDay ? `（終日の予定 ${st.allDay}件は対象外）` : ""}`); return; }
    commit(all, `${st.added}件を取り込みました${st.allDay ? `・終日${st.allDay}件は対象外` : ""}${st.ruleFirst ? `・繰り返し${st.ruleFirst}件は初回のみ` : ""}`);
  }
  if (e.target.id === "jsonIn") {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const o = JSON.parse(await f.text());
      if (!o || o.app !== "kizami") throw new Error("not kizami");
      const before = JSON.stringify(db);
      mergeInto(db, o); saveDb(); render(); sync.soon();
      toast(before === JSON.stringify(db) ? "新しい内容はありませんでした" : "バックアップを読み込みました");
    } catch (err) { toast("このファイルは、きざみのバックアップとして読み取れませんでした"); }
  }
});
$("#settingsView").addEventListener("click", async (e) => {
  const id = e.target.id;
  if (id === "tokSave") {
    const v = $("#tokIn").value.trim(); if (!v) { toast("トークンを貼り付けてください"); return; }
    if (v !== S.gistToken) { S.gistId = ""; S.lastSync = 0; }
    S.gistToken = v; saveS(); renderSettings(); sync.set("busy"); await sync.run();
    toast(sync.state === "ok" ? "同期しました" : "同期できませんでした: " + sync.msg);
  } else if (id === "syncNow") { await sync.run(); toast(sync.state === "ok" ? "同期しました" : "同期できませんでした: " + sync.msg); }
  else if (id === "tokOff") { if (!confirm("この端末の同期をやめます。予定はこの端末に残ります。よろしいですか？")) return; S.gistToken = ""; S.gistId = ""; S.lastSync = 0; saveS(); sync.set(""); renderSettings(); }
  else if (id === "icsClear") {
    const list = live("blocks").filter((b) => b.src === "ics");
    if (!list.length) { toast("取り込んだ予定はありません"); return; }
    if (!confirm(`取り込んだ予定 ${list.length}件を消します。よろしいですか？`)) return;
    commit(list.map((b) => B({ ...b, deleted: true })), `${list.length}件を消しました`);
  } else if (id === "icsOut") {
    const tk = today(); const list = live("blocks").filter((b) => b.date >= tk && b.src !== "ics").sort((a, b) => (a.date + hm2(a.start) > b.date + hm2(b.start) ? 1 : -1));
    if (!list.length) { toast("書き出す予定がありません"); return; }
    download(`kizami-${tk}.ics`, exportICS(list), "text/calendar"); toast(`${list.length}件を書き出しました`);
  } else if (id === "jsonOut") {
    const o = { app: "kizami", v: 1, exportedAt: new Date().toISOString() }; COLS.forEach((c) => (o[c] = db[c]));
    download(`kizami-backup-${today()}.json`, JSON.stringify(o), "application/json");
  } else if (id === "wipe") {
    if (!confirm("この端末の予定・やること・型をすべて消します。同期している場合は、他の端末からも消えます。よろしいですか？")) return;
    const t = Date.now(); COLS.forEach((c) => Object.keys(db[c]).forEach((k) => (db[c][k] = { id: k, deleted: true, updatedAt: t })));
    saveDb(); render(); sync.soon(); toast("すべて消しました");
  } else if (id === "install" && installEvt) { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; renderSettings(); }
});
function applyTheme() { if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = S.theme; }

/* ========== キーボード（PC） ========== */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector("dialog[open]")) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) { if (e.key === "Escape") document.activeElement.blur(); return; }
  const k = e.key;
  if (k === "n" || k === "/") { e.preventDefault(); if (ui.view !== "day") setView("day"); $("#qaInput").focus(); }
  else if (k === "t") go(today());
  else if (k === "ArrowLeft" || k === "j") $("#prev").click();
  else if (k === "ArrowRight" || k === "k") $("#next").click();
  else if (k === "w") setView(ui.view === "week" ? "day" : "week");
  else if (k === "d") setView("day");
});

/* ========== 起動 ========== */
applyTheme();
if (ui.view === "settings") renderSettings();
if (!["day", "week", "tasks", "settings"].includes(ui.view)) ui.view = "day";
render();
scrollToFocus();
sync.set(""); if (sync.on()) sync.run();
let lastMin = Math.floor(nowM());
setInterval(() => {
  const m = Math.floor(nowM());
  if (m !== lastMin) {
    lastMin = m;
    if (followToday && sel !== today()) { sel = today(); calMonth = sel.slice(0, 7); }
    if (!drag) { renderView(); renderHeader(); renderMinical(); }
    tickNotify();
  }
  tickSecond();
}, 1000);
tickNotify();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (!drag) render(); sync.run(); tickNotify(); } });
window.addEventListener("online", () => sync.run());
setInterval(() => { if (document.visibilityState === "visible") sync.run(); }, 120000);
window.addEventListener("storage", (e) => { if (e.key === PFX + "db") { db = load("db", db); COLS.forEach((c) => { if (!db[c]) db[c] = {}; }); render(); } });
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then((r) => (swReg = r)).catch(() => {});
}
</script>
